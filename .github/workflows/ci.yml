name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript
        run: pnpm exec vue-tsc -b

      - name: ESLint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test:unit

      - name: Coverage
        run: pnpm run test:coverage

      - name: Semantic Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci')
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application
        run: pnpm run build
        env:
          VITE_BASE_URL: /Trex-Http-Client/

      - name: Audit Bundle Size and Budget
        run: pnpm run perf:bundle

      - name: Lighthouse CI Audit
        run: pnpm run perf:lighthouse

      - name: Upload Performance Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            dist/performance-report.json
            dist/performance-report.md
            .lighthouseci/
          retention-days: 14

      - name: Validate Documentation Build
        if: github.event_name == 'pull_request'
        run: pnpm run docs:generate

      - name: Generate Smart Documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run docs:generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Validate Documentation Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: test -f ./dist/docs/index.html && test -f ./dist/docs/api/index.html

      - name: Upload dist artifact for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
